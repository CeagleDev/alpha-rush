<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>e4 fixture — lighting / assets / textures</title>
<!--
  E4's fixture: only E4's modules plus the harness (rig, assetlib, surfaces). A wet road of
  alley_road_chunk placeholders, shophouse placeholders as walls, rows of emitting placeholders
  (wall_lightbox, standing_lightbox, paper_lantern, vending_machine, lantern_string), a real
  tau_coin and runner from game/assets/, a static camera at E2's chase position (0, 2.6, -6.5)
  looking at (0, 1.2, 12), portrait. Chunk groups carry userData.lights aggregated with
  assets.lights(inst) exactly as chunks.js does, and a track stub exposes lights()/groundY().
  ?q=phone|high  ?fill=  ?lights=  ?pools=0  ?sky=0  ?chamfer=0
-->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #110f12; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #log { position: fixed; left: 6px; bottom: 6px; color: #eee2c8; font: 10px ui-monospace, monospace; opacity: .8; pointer-events: none; white-space: pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="log"></div>
<script type="module">
import * as THREE from 'three';
import { createRig } from '../../game/rig.js';
import * as assets from '../../game/src/assets.js';
import * as textures from '../../game/src/textures.js';
import * as lighting from '../../game/src/lighting.js';
import * as perf from '../../game/src/perf.js';
import { bakeStatic } from '../../game/assetlib.js';

const Q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const phone = Q.get('q') ? Q.get('q') === 'phone' : innerWidth < 700;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !phone, powerPreference: 'high-performance', stencil: false, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0x110f12, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 2.6, -6.5);
camera.lookAt(0, 1.2, 12);
scene.add(camera);
const rig = createRig(THREE, renderer, scene, { hour: 19.4, azimuth: 250, tier: phone ? 'phone' : 'high', camera });

const state = { z: 0, x: 0 };
const config = { PHONE_MAX_W: 700, DRAW_BUDGET: 900, TRI_BUDGET: 1500000, phone };
const chunks = [];
const trackStub = {
  lights() {
    if (trackStub._cache) return trackStub._cache;
    const out = [];
    for (const g of chunks) for (const l of g.userData.lights) out.push({ x: l.x + g.position.x, y: l.y + g.position.y, z: l.z + g.position.z, color: l.color, intensity: l.intensity, range: l.range });
    return (trackStub._cache = out);
  },
  groundY() { return 0; },
};
const ctx = { THREE, scene, camera, renderer, rig, config, state, assets, textures, modules: { track: trackStub } };

const coarseStats = [];
const log = [];
const say = (s) => { log.push(s); document.getElementById('log').textContent = log.slice(-8).join('\n'); };

async function build() {
  await textures.init(ctx);
  assets.init(ctx);
  perf.init(ctx);
  await lighting.init(ctx);

  // four chunks of road with walls and emitters, built the way chunks.js builds: instances placed
  // under a chunk root, lights aggregated with assets.lights(inst) in chunk space
  const put = async (root, name, x, y, z, ry = 0, opts) => {
    const inst = await assets.get(name, opts);
    inst.position.set(x, y, z); inst.rotation.y = ry;
    root.add(inst);
    return inst;
  };
  const SHOP_X = 4.5;
  for (let ci = -1; ci < 4; ci++) {
    const root = new THREE.Group();
    const placed = [];
    placed.push(await put(root, 'alley_road_chunk', 0, 0, 15));
    for (const s of [-1, 1]) {
      for (let k = 0; k < 6; k++) {
        const name = ['shophouse_a', 'shophouse_b', 'shophouse_c', 'shophouse_d'][(k + (s > 0 ? 1 : 0) + ci + 9) % 4];
        placed.push(await put(root, name, s * (SHOP_X + 3), 0, k * 5 + 2.5, s > 0 ? Math.PI / 2 : -Math.PI / 2));
      }
      // Signage density from STYLE.md: a yokocho is lit by its own shopfronts, so the frame must
      // carry >= 6 lit faces and the road must be lit CONTINUOUSLY, not in pools 15 m apart. This
      // is what the real chunk recipe places (chunks.js WALL / PROPS lists); a sparse fixture
      // measures a street that does not exist and makes the lighting look weaker than it is.
      const face = s > 0 ? -Math.PI / 2 : Math.PI / 2;
      for (let z = 2; z < 30; z += 4) placed.push(await put(root, 'wall_lightbox', s * (SHOP_X - 0.08), z % 8 < 1 ? 4.2 : 2.6, z + (s > 0 ? 2 : 0), face));
      for (let z = 5; z < 30; z += 8) placed.push(await put(root, 'standing_lightbox', s * (SHOP_X - 0.6), 0, z + (s > 0 ? 3 : 0), face));
      for (let z = 8; z < 30; z += 6) placed.push(await put(root, 'paper_lantern', s * (SHOP_X - 0.5), 0, z + (s > 0 ? 3 : 0)));
      for (let z = 3; z < 30; z += 7) placed.push(await put(root, 'tin_awning', s * (SHOP_X - 0.75), 0, z, face));
      placed.push(await put(root, 'utility_pole', s * (SHOP_X - 0.3), 0, 26 - (s > 0 ? 14 : 0)));
      placed.push(await put(root, 'bins_bags', s * (SHOP_X - 0.9), 0, 24 + (s > 0 ? -8 : 0)));
      placed.push(await put(root, 'crate_stack', s * (SHOP_X - 0.7), 0, 1.5 + (s > 0 ? 20 : 0)));
      placed.push(await put(root, 'noren_string', s * (SHOP_X - 0.4), 0, 17 - (s > 0 ? 6 : 0), face));
    }
    placed.push(await put(root, 'vending_machine', (ci % 2 ? 1 : -1) * (SHOP_X - 0.55), 0, 15, (ci % 2 ? -1 : 1) * Math.PI / 2));
    placed.push(await put(root, 'lantern_string', 0, 0, 9 + (ci % 2) * 12, 0));
    // >= 3 cable spans per chunk (STYLE.md / CLAIMS C6), at the three heights the bar shows
    for (const [x, y] of [[-1.2, 0], [0.4, 0.7], [1.8, 1.4]]) placed.push(await put(root, 'cable_span', x, y, 15));
    placed.push(await put(root, 'lantern_string', 0, 0, 21 - (ci % 2) * 9, 0));
    root.updateMatrixWorld(true);
    const lights = [];
    for (const inst of placed) for (const l of assets.lights(inst)) lights.push({ x: l.x, y: l.y, z: l.z, color: l.color, intensity: l.intensity, range: l.range });
    // bake per chunk exactly as chunks.js does, so the draw count is the game's and not the fixture's,
    // plus the second coarser bake perf.js offers E1, so its cost and its visibility can be measured
    const chunk = new THREE.Group();
    chunk.name = 'chunk_fixture' + ci;
    const co = perf.coarseBake(root);
    coarseStats.push({ tris: co.tris, dropped: co.dropped, kept: co.kept });
    chunk.add(bakeStatic(root));
    co.group.visible = false;
    chunk.add(co.group);
    chunk.userData.coarse = co.group;
    chunk.userData.lights = lights;
    chunk.position.set(0, 0, ci * 30);
    chunk.updateMatrixWorld(true);
    scene.add(chunk);
    chunks.push(chunk);
  }
  trackStub._cache = null;

  // FAR BAND stand-in for E1's src/farband.js (not my file): one merged mesh of dark blocks with
  // lit windows at 120-300 m. Without it the alley's vanishing point is open sky, and the top of
  // the frame measures far bluer than the bar, which is a composition difference and not lighting.
  {
    const rng = (() => { let a = 12345; return () => ((a = (a * 1664525 + 1013904223) >>> 0) / 4294967296); })();
    const g = new THREE.Group();
    const dark = new THREE.MeshStandardMaterial({ color: 0x212841, roughness: 1, metalness: 0 });
    const win = new THREE.MeshStandardMaterial({ color: 0x110f12, emissive: 0xe5b055, emissiveIntensity: 1.8, roughness: 0.35 });
    const winCool = new THREE.MeshStandardMaterial({ color: 0x110f12, emissive: 0x9accf2, emissiveIntensity: 1.6, roughness: 0.35 });
    const winGeo = new THREE.BoxGeometry(1.0, 1.4, 0.2);
    for (let i = 0; i < 64; i++) {
      const ang = (rng() * 2 - 1) * (70 * Math.PI / 180);
      const r = 120 + rng() * 180;
      const cx = Math.sin(ang) * r, cz = Math.cos(ang) * r + 40;
      const w = 12 + rng() * 18, d = 12 + rng() * 18, h = 15 + rng() * 25 + (r - 120) * 0.05;
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), dark);
      b.position.set(cx, h / 2, cz); g.add(b);
      for (let k = 0; k < 26; k++) {
        const m = new THREE.Mesh(winGeo, rng() < 0.22 ? winCool : win);
        m.position.set(cx + (rng() - 0.5) * w * 0.8, 4 + rng() * (h - 6), cz - d / 2 - 0.1);
        g.add(m);
      }
    }
    const band = bakeStatic(g);
    band.name = 'farband_stub';
    band.traverse((o) => { o.castShadow = false; o.receiveShadow = false; });
    scene.add(band);
  }

  // the hero and a coin from the real assets
  const runner = await assets.get('runner', { keepHierarchy: true });
  runner.position.set(0, 0, 0); scene.add(runner);
  const coin = await assets.get('tau_coin');
  coin.position.set(2, 0.7, 6); scene.add(coin);
  const coin2 = await assets.get('tau_coin');
  coin2.position.set(2, 0.7, 7.5); scene.add(coin2);
  say(`runner placeholder=${runner.userData.placeholder} coin placeholder=${coin.userData.placeholder} lights/chunk=${chunks[1].userData.lights.length}`);
  say(`textures ${JSON.stringify(textures.status())}`);
  window.__COARSE__ = coarseStats;
  rig.refresh();
  await Promise.race([rig.ready, new Promise((r) => setTimeout(r, 8000))]);
}

let last = performance.now(), frames = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  lighting.update(dt);
  perf.update(dt);
  rig.render(camera, dt);
  frames++;
  if (frames % 30 === 0) {
    const r = perf.report(), l = lighting.report();
    document.getElementById('log').textContent = `${r.tier} ${r.draws} draws ${(r.tris / 1000).toFixed(0)}k tris ${r.fps} fps · lights ${l.active}/${l.pool} warm ${l.warm} cool ${l.cool} · sky ${l.sky}\n` + log.slice(-4).join('\n');
  }
  window.__FRAMES__ = frames;
}

/**
 * Measure the frame the way work/e4/measure.py measures the PNG, but from the live framebuffer, so
 * one browser launch can sweep lighting.tune() instead of one launch per combination. readPixels
 * rows are bottom-up: row 0 of the buffer is the BOTTOM of the picture.
 */
window.__MEASURE__ = () => {
  rig.render(camera, 0.016);
  const gl = renderer.getContext();
  const s = renderer.getDrawingBufferSize(new THREE.Vector2());
  const W = s.x, H = s.y;
  const buf = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  const lum = new Float64Array(W * H);
  let dark = 0, darkRB = 0, blueTop = 0, topN = 0, amberBot = 0, botN = 0, over200 = 0;
  const topFrom = Math.floor(H * 0.8);          // buffer rows >= this are the TOP fifth
  const botTo = Math.floor(H * 0.25);           // buffer rows < this are the BOTTOM quarter
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const r = buf[i], g = buf[i + 1], b = buf[i + 2];
      const L = 0.299 * r + 0.587 * g + 0.114 * b;
      lum[y * W + x] = L;
      if (L > 200) over200++;
      if (L < 60) { dark++; darkRB += r - b; }
      if (y >= topFrom) { topN++; if (b - r >= 60) blueTop++; }
      if (y < botTo) { botN++; if (L > 100 && r > b + 40) amberBot++; }
    }
  }
  // orientation probe: the same three picture points read under both row conventions, so a
  // disagreement with the saved PNG is attributable instead of mysterious
  const at = (px, py, flip) => { const y = flip ? (H - 1 - py) : py; const i = (y * W + px) * 4; return [buf[i], buf[i + 1], buf[i + 2]]; };
  const probe = { bottomUp: [at(195, 5, true), at(195, 360, true), at(195, 700, true)], topDown: [at(195, 5, false), at(195, 360, false), at(195, 700, false)] };
  const sorted = Float64Array.from(lum).sort();
  const q = (p) => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * p))];
  return {
    median: +q(0.5).toFixed(1), p98: +q(0.98).toFixed(1),
    over200: +(over200 / (W * H) * 100).toFixed(2),
    darkRB: +(darkRB / Math.max(1, dark)).toFixed(1),
    blueTop: +(blueTop / Math.max(1, topN) * 100).toFixed(1),
    amberBot: +(amberBot / Math.max(1, botN) * 100).toFixed(2), probe, size: [W, H],
  };
};

/**
 * How far away a chunk stops being worth drawing, measured against OUR fog rather than carried
 * over from another build (traps.md). For each distance: hide every chunk past it, re-render, and
 * compare every pixel with the full frame. "Invisible in a filmstrip" is a mean absolute difference
 * under about 1 luma unit with no large local excursion.
 */
window.__LODMEASURE__ = (opts = {}) => {
  if (opts.fogDensity !== undefined) lighting.tune({ fogDensity: opts.fogDensity, fogStart: opts.fogStart ?? 10 });
  const gl = renderer.getContext();
  const s = renderer.getDrawingBufferSize(new THREE.Vector2());
  const W = s.x, H = s.y, N = W * H * 4;
  const grab = () => { const b = new Uint8Array(N); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, b); return b; };
  const info = () => ({ draws: renderer.info.render.calls, tris: renderer.info.render.triangles });
  const setAll = (fn) => { for (const c of chunks) { const co = c.userData.coarse; c.visible = true; for (const ch of c.children) ch.visible = ch !== co; if (co) co.visible = false; fn(c, co); } };
  const cz = camera.position.z;
  setAll(() => {});
  rig.render(camera, 0.016);
  const base = grab(), baseInfo = info();
  const diff = (b) => { let sum = 0, max = 0; for (let i = 0; i < N; i += 4) { const d = Math.abs(b[i] - base[i]) * 0.299 + Math.abs(b[i + 1] - base[i + 1]) * 0.587 + Math.abs(b[i + 2] - base[i + 2]) * 0.114; sum += d; if (d > max) max = d; } return { mean: +(sum / (W * H)).toFixed(3), max: Math.round(max) }; };
  const rows = [];
  for (const D of [20, 30, 40, 55, 70, 90, 120]) {
    setAll((c) => { c.visible = (c.position.z - cz) <= D; });
    rig.render(camera, 0.016);
    const i2 = info();
    rows.push({ mode: 'cull', D, ...diff(grab()), draws: i2.draws, tris: i2.tris });
  }
  for (const D of [20, 30, 40, 55, 70, 90]) {
    setAll((c, co) => { const useCoarse = (c.position.z - cz) > D; if (co) { co.visible = useCoarse; for (const ch of c.children) if (ch !== co) ch.visible = !useCoarse; } });
    rig.render(camera, 0.016);
    const i2 = info();
    rows.push({ mode: 'coarse', D, ...diff(grab()), draws: i2.draws, tris: i2.tris });
  }
  setAll(() => {});
  rig.render(camera, 0.016);
  return { base: baseInfo, size: [W, H], rows, coarse: window.__COARSE__, claims: window.__MEASURE__() };
};

build().then(() => {
  requestAnimationFrame(loop);
  window.__CTX__ = ctx;
  window.__perf = perf; window.__lighting = lighting; window.__assets = assets; window.__textures = textures;
  window.__READY__ = true;
}).catch((e) => { console.error(e); say('ERROR ' + e.message); window.__ERROR__ = String(e && e.stack || e); });
</script>
</body>
</html>
