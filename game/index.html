<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<title>ALPHA RUSH</title>
<link rel="icon" href="data:,">
<!-- The one network dependency. Same CDN and version as assetlib.js / rig.js resolve their bare
     'three' and 'three/addons/' specifiers through, so there is exactly ONE copy of three. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<style>
  /* ALPHA RUSH front end (work/v2/UI_BRIEF.md). Racing-game look: chamfered panels (clip-path), heavy italic
     condensed system type, diagonal stripes, cyan / magenta / amber on deep navy. Glow is text-shadow and
     box-shadow only; motion is CSS transitions <= 200 ms and one slow background-position stripe. */
  :root {
    --cy: #22e8ff; --mg: #ff2d95; --am: #ffb300; --navy: #0b1020; --navy2: #121a38; --ink: #eef3ff; --dim: rgba(238,243,255,.62);
    --line: rgba(34,232,255,.3); --red: #ff3b4a;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    --disp: "Avenir Next Condensed", "Roboto Condensed", sans-serif-condensed, "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --cut: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    --cut-s: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    --stripe: repeating-linear-gradient(-55deg, rgba(255,255,255,.07) 0 10px, transparent 10px 26px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--navy); color: var(--ink);
    font-family: var(--disp); font-weight: 700; -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas#c { display: block; width: 100%; height: 100%; touch-action: none; position: fixed; inset: 0; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; }
  .d { font-family: var(--disp); font-weight: 900; font-style: italic; letter-spacing: .01em; text-transform: uppercase; }
  .num { font-variant-numeric: tabular-nums; }
  @keyframes stripes { from { background-position: 0 0; } to { background-position: 74px 0; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ============================================================ HUD (in play), built by src/hud.js */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none;
    padding: calc(8px + var(--sat)) calc(10px + var(--sar)) calc(8px + var(--sab)) calc(10px + var(--sal)); }
  #hud.on { display: block; }
  #hud .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  #hud .lbl { font-size: 10px; letter-spacing: .32em; color: var(--cy); text-shadow: 0 0 8px rgba(34,232,255,.7); }
  #hud .scorerow { display: flex; align-items: center; gap: 8px; }
  #hud .score { font-size: clamp(38px, 11vw, 52px); line-height: .95; letter-spacing: -.01em; color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.8), 0 0 18px rgba(34,232,255,.55); }
  #hud .mult { font-size: 15px; padding: 3px 10px 3px 8px; background: var(--mg); color: #fff; clip-path: var(--cut-s);
    box-shadow: 0 0 14px rgba(255,45,149,.7); transition: transform .15s; transform: skewX(-10deg); }
  #hud .mult.hot { background: var(--am); color: #1a1200; box-shadow: 0 0 16px rgba(255,179,0,.9); transform: skewX(-10deg) scale(1.08); }
  #hud .dist { font-size: 15px; letter-spacing: .06em; color: var(--cy); margin-top: 3px; text-shadow: 0 1px 0 #000, 0 0 10px rgba(34,232,255,.5); }
  #hud .dist small { font-size: 10px; letter-spacing: .3em; color: var(--dim); margin-left: 4px; }
  #hud .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #hud .pauseb { pointer-events: auto; width: 48px; height: 48px; display: grid; place-items: center; background: rgba(11,16,32,.75);
    clip-path: var(--cut-s); border: 0; box-shadow: inset 0 0 0 2px var(--line); }
  #hud .pauseb:active { background: rgba(34,232,255,.35); }
  #hud .pauseb i { display: block; width: 16px; height: 18px; background: linear-gradient(90deg, var(--cy) 0 5px, transparent 5px 11px, var(--cy) 11px); transform: skewX(-10deg); }
  #hud .coins { display: flex; align-items: center; gap: 5px; font-size: clamp(22px, 6vw, 28px); color: var(--am);
    padding: 2px 10px; background: rgba(11,16,32,.6); clip-path: var(--cut-s); text-shadow: 0 0 10px rgba(255,179,0,.6); }
  #hud .coins svg { width: .8em; height: .8em; display: block; filter: drop-shadow(0 0 4px rgba(255,179,0,.8)); }
  #hud .powers { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; width: 132px; }
  #hud .pw { display: none; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; text-shadow: 0 1px 0 #000; }
  #hud .pw.on { display: block; animation: rise .18s; }
  #hud .pw i { display: block; height: 7px; margin-top: 3px; background: rgba(238,243,255,.16); clip-path: var(--cut-s); overflow: hidden; transform: skewX(-12deg); }
  #hud .pw b { display: block; height: 100%; width: 100%; background: var(--cy); box-shadow: 0 0 8px var(--cy); }
  #hud .pw-magnetT b { background: #ff5a4a; box-shadow: 0 0 8px #ff5a4a; } #hud .pw-shieldT b { background: #7fd4ff; box-shadow: 0 0 8px #7fd4ff; }
  #hud .pw-x2T b { background: var(--am); box-shadow: 0 0 8px var(--am); } #hud .pw-sneakT b { background: #5af0d0; box-shadow: 0 0 8px #5af0d0; }
  #hud .zone { position: absolute; left: 50%; transform: translateX(-50%) skewX(-10deg); top: calc(10px + var(--sat)); font-size: 10px; letter-spacing: .3em;
    text-transform: uppercase; color: var(--ink); background: rgba(11,16,32,.55); padding: 4px 12px; clip-path: var(--cut-s); opacity: .8; white-space: nowrap; }
  #hud .toast { position: absolute; left: 50%; top: calc(152px + var(--sat)); transform: translateX(-50%) translateY(-8px); max-width: 88vw; text-align: center;
    font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #061018; background: var(--cy); padding: 9px 18px; clip-path: var(--cut-s);
    box-shadow: 0 0 22px rgba(34,232,255,.6); opacity: 0; transition: opacity .18s, transform .18s; font-weight: 900; font-style: italic; }
  #hud .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #hud .toast.ach { background: var(--mg); color: #fff; box-shadow: 0 0 22px rgba(255,45,149,.7); }
  #hud .speedo { position: absolute; left: calc(10px + var(--sal)); bottom: calc(10px + var(--sab)); }
  #hud .speedo .v { font-size: clamp(34px, 10vw, 46px); line-height: .9; color: #fff; text-shadow: 0 2px 0 #000, 0 0 16px rgba(34,232,255,.45); }
  #hud .speedo .v small { font-size: 11px; letter-spacing: .3em; color: var(--cy); margin-left: 5px; }
  #hud .speedo .segs { display: flex; gap: 3px; margin-top: 5px; transform: skewX(-18deg); }
  #hud .speedo .segs b { width: 11px; height: 8px; background: rgba(238,243,255,.14); }
  #hud .speedo .segs b.on { background: var(--cy); box-shadow: 0 0 6px var(--cy); }
  #hud .speedo .segs b:nth-child(n+8).on { background: var(--mg); box-shadow: 0 0 6px var(--mg); }
  #hud .pack { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(34px + var(--sab)); width: min(200px, 48vw); }
  #hud .pack .plbl { font-size: 10px; letter-spacing: .32em; text-transform: uppercase; color: var(--dim); text-align: center; margin-bottom: 4px; }
  #hud .pack .bar { height: 8px; background: rgba(238,243,255,.14); clip-path: var(--cut-s); overflow: hidden; transform: skewX(-14deg); }
  #hud .pack .fill { height: 100%; width: 0%; background: var(--am); box-shadow: 0 0 8px var(--am); transition: width .12s linear; }
  #hud .pack.hot .fill { background: var(--red); box-shadow: 0 0 10px var(--red); }
  #hud .pack.hot .plbl { color: var(--red); animation: pulse .5s infinite; }
  #hud .perf { position: absolute; right: calc(10px + var(--sar)); bottom: calc(8px + var(--sab)); font: 10px var(--mono); opacity: .45; letter-spacing: .06em; }

  /* ============================================================ screens (home, pause, death) */
  .screen { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; color: var(--ink); }
  .screen.on { display: flex; }
  .stripes { position: absolute; inset: 0; pointer-events: none; background: var(--stripe); opacity: .35; animation: stripes 6s linear infinite; }
  .panel { position: relative; background: rgba(18,26,56,.92); clip-path: var(--cut); box-shadow: inset 0 0 0 2px var(--line); }
  .panel::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--cy), var(--mg)); }
  .abtn { display: block; width: 100%; min-height: 56px; padding: 12px 20px; color: var(--ink); background: rgba(18,26,56,.9); clip-path: var(--cut-s);
    box-shadow: inset 0 0 0 2px var(--line); font-size: 17px; letter-spacing: .22em; text-indent: .22em; text-transform: uppercase; font-weight: 900; font-style: italic;
    transition: transform .12s, background .12s; }
  .abtn:active { transform: scale(.97); background: rgba(34,232,255,.25); }
  .abtn.cy { background: var(--cy); color: #061018; box-shadow: 0 0 26px rgba(34,232,255,.5); }
  .abtn.cy:active { background: #7ff1ff; }
  .abtn.mg { background: var(--mg); color: #fff; box-shadow: 0 0 22px rgba(255,45,149,.5); }
  .abtn[disabled] { opacity: .45; }
  .abtn.stripe { background-image: var(--stripe); animation: stripes 1.6s linear infinite; }

  /* ---------------- HOME */
  #home { background: linear-gradient(180deg, rgba(11,16,32,.86) 0%, rgba(11,16,32,.94) 40%, #0b1020 100%); z-index: 20; }
  #home::after { content: ""; position: absolute; left: -10%; right: -10%; top: -6%; height: 34%; pointer-events: none; z-index: 0;
    background: linear-gradient(100deg, transparent 38%, rgba(34,232,255,.16) 38.5%, rgba(34,232,255,.16) 46%, transparent 46.5%, transparent 52%, rgba(255,45,149,.18) 52.5%, rgba(255,45,149,.18) 56%, transparent 56.5%); }
  #home .hh { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: calc(12px + var(--sat)) calc(14px + var(--sar)) 8px calc(14px + var(--sal)); }
  .wordmark { display: flex; flex-direction: column; line-height: .82; transform: skewX(-8deg); }
  .wordmark span { font-size: 34px; font-weight: 900; font-style: italic; letter-spacing: .04em; color: #fff; text-shadow: 0 0 18px rgba(34,232,255,.55), 0 2px 0 rgba(0,0,0,.6); }
  .wordmark span + span { color: var(--cy); font-size: 28px; letter-spacing: .28em; text-shadow: 0 0 18px rgba(34,232,255,.8); }
  .chips { display: flex; gap: 8px; }
  .chip { display: flex; flex-direction: column; align-items: flex-end; padding: 6px 12px 6px 10px; background: rgba(18,26,56,.95); clip-path: var(--cut-s); box-shadow: inset 0 0 0 2px var(--line); min-width: 74px; }
  .chip i { font-style: normal; font-size: 9px; letter-spacing: .3em; color: var(--dim); }
  .chip b { font-size: 20px; line-height: 1; font-style: italic; font-weight: 900; color: #fff; }
  .chip.bank b { color: var(--am); text-shadow: 0 0 10px rgba(255,179,0,.6); }
  .chip.bank i { color: var(--am); display: flex; align-items: center; gap: 4px; }
  .chip svg { width: 10px; height: 10px; }
  #home .hbody { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch;
    padding: 4px calc(12px + var(--sar)) 8px calc(12px + var(--sal)); width: min(100%, 560px); margin: 0 auto; }
  .pane { display: none; flex: 1; min-height: 0; flex-direction: column; animation: rise .18s; }
  .pane.on { display: flex; }
  .pane.scroll { overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
  .pane.scroll::after { content: "ALPHA RUSH"; display: block; margin-top: auto; padding-top: 28px; text-align: center; font-size: 48px; font-weight: 900; font-style: italic; letter-spacing: .08em; color: rgba(34,232,255,.08); transform: skewX(-8deg); pointer-events: none; }
  .phead { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: .3em; color: var(--cy); text-transform: uppercase; margin: 6px 4px 8px; }
  .phead b { font-style: italic; font-weight: 900; font-size: 15px; color: #fff; }
  .phead em { font-style: normal; color: var(--dim); letter-spacing: .12em; font-size: 11px; }

  /* character carousel */
  .car { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; overflow: hidden; touch-action: pan-y; }
  .track { display: flex; width: 100%; transition: transform .2s ease-out; will-change: transform; }
  .card { flex: 0 0 86%; margin: 0 1%; transition: transform .2s, opacity .2s; transform: scale(.9); opacity: .45; cursor: pointer; }
  .card.on { transform: none; opacity: 1; cursor: default; }
  .card .art { position: relative; height: clamp(150px, 31vh, 270px); overflow: hidden; background: var(--c1); display: grid; place-items: center; }
  .card .art::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-60deg, rgba(0,0,0,.16) 0 14px, transparent 14px 36px); }
  .card .art::after { content: ""; position: absolute; right: -30%; top: -40%; width: 90%; height: 180%; background: var(--c2); opacity: .22; transform: skewX(-22deg); }
  .card .mono { position: relative; z-index: 1; font-size: clamp(120px, 22vh, 180px); line-height: 1; font-weight: 900; font-style: italic; color: var(--c2);
    text-shadow: 0 0 30px var(--c2), 6px 6px 0 rgba(0,0,0,.35); transform: skewX(-8deg); }
  .card .ring { position: absolute; z-index: 0; width: 66%; aspect-ratio: 1; border-radius: 50%; border: 10px solid var(--c2); opacity: .28; }
  .card .idx { position: absolute; z-index: 2; left: 14px; top: 10px; font-size: 12px; letter-spacing: .3em; color: #fff; opacity: .8; }
  .card .idx b { font-size: 26px; font-style: italic; display: block; line-height: 1; }
  .card .tag { position: absolute; z-index: 2; right: 12px; bottom: 10px; font-size: 10px; letter-spacing: .28em; color: #fff; background: rgba(0,0,0,.45); padding: 4px 8px; clip-path: var(--cut-s); }
  .card .info { padding: 12px 16px 14px; }
  .card .name { font-size: clamp(30px, 8vw, 40px); line-height: .95; font-weight: 900; font-style: italic; color: #fff; letter-spacing: .02em; text-shadow: 0 0 14px rgba(34,232,255,.35); }
  .card .title { font-size: 11px; letter-spacing: .34em; color: var(--cy); margin-top: 4px; text-transform: uppercase; }
  .card .story { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 13px; line-height: 1.4; color: var(--dim); margin: 10px 0 0; min-height: 3.6em;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .stats { display: flex; gap: 10px; margin-top: 12px; }
  .st { flex: 1; }
  .st i { display: block; font-style: normal; font-size: 9px; letter-spacing: .28em; color: var(--dim); margin-bottom: 4px; }
  .segs { display: flex; gap: 3px; transform: skewX(-16deg); }
  .segs b { flex: 1; height: 8px; background: rgba(238,243,255,.14); }
  .segs b.on { background: var(--cy); box-shadow: 0 0 6px rgba(34,232,255,.7); }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 48px; height: 64px; display: grid; place-items: center;
    background: rgba(11,16,32,.7); clip-path: var(--cut-s); box-shadow: inset 0 0 0 2px var(--line); color: var(--cy); font-size: 26px; font-weight: 900; }
  .arrow:active { background: rgba(34,232,255,.3); }
  .arrow.l { left: 0; } .arrow.r { right: 0; }
  .dots { display: flex; justify-content: center; gap: 8px; margin: 6px 0 8px; }
  .dots i { width: 22px; height: 6px; background: rgba(238,243,255,.2); transform: skewX(-20deg); transition: background .15s; }
  .dots i.on { background: var(--cy); box-shadow: 0 0 8px var(--cy); }
  #startb { font-size: 24px; min-height: 64px; width: min(100%, 420px); margin: 0 auto; }
  #loadline { font: 10px var(--mono); letter-spacing: .2em; color: var(--dim); height: 16px; text-align: center; margin-top: 6px; text-transform: uppercase; }

  /* rows: missions / tasks / power-ups */
  .row { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 12px 18px; margin-bottom: 8px; background: rgba(18,26,56,.9); clip-path: var(--cut-s); box-shadow: inset 0 0 0 1px rgba(34,232,255,.16); }
  .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--cy); }
  .row.done::before { background: var(--am); }
  .row .rt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .row .rt span { font-size: 15px; font-style: italic; font-weight: 900; letter-spacing: .02em; }
  .row .rt em { font-style: normal; font-size: 12px; letter-spacing: .1em; color: var(--cy); white-space: nowrap; }
  .row.done .rt em { color: var(--am); }
  .row .bar { height: 7px; background: rgba(238,243,255,.12); clip-path: var(--cut-s); overflow: hidden; transform: skewX(-14deg); }
  .row .bar b { display: block; height: 100%; background: var(--cy); box-shadow: 0 0 8px var(--cy); transition: width .2s; }
  .row.done .bar b { background: var(--am); box-shadow: 0 0 8px var(--am); }
  .row .pay { font-size: 11px; letter-spacing: .2em; color: var(--am); }
  .row .desc { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 12px; color: var(--dim); line-height: 1.35; }
  .row.pw { flex-direction: row; align-items: center; gap: 12px; padding-left: 14px; }
  .row.pw::before { background: var(--pc); }
  .row.pw .ico { flex: 0 0 44px; height: 44px; display: grid; place-items: center; background: var(--pc); clip-path: var(--cut-s); color: #061018; font-size: 18px; font-style: italic; font-weight: 900; box-shadow: 0 0 14px var(--pc); }
  .row.pw .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .row.pw .lv { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: .2em; color: var(--dim); }
  .row.pw .lv .segs { width: 70px; }
  .row.pw .lv .segs b.on { background: var(--pc); box-shadow: 0 0 6px var(--pc); }
  .row.pw .up { flex: 0 0 auto; min-height: 48px; min-width: 76px; padding: 6px 10px; background: var(--cy); color: #061018; clip-path: var(--cut-s); font-size: 12px; letter-spacing: .12em; font-style: italic; font-weight: 900; line-height: 1.15; text-align: center; }
  .row.pw .up small { display: block; font-size: 11px; letter-spacing: .06em; }
  .row.pw .up[disabled] { background: rgba(238,243,255,.14); color: var(--dim); box-shadow: none; }
  .row.pw .up.max { background: var(--am); }
  .mchip { display: inline-flex; gap: 14px; padding: 6px 14px; margin: 0 auto 10px; background: rgba(18,26,56,.9); clip-path: var(--cut-s); box-shadow: inset 0 0 0 1px var(--line); font-size: 11px; letter-spacing: .2em; color: var(--dim); }
  .mchip b { color: var(--mg); font-style: italic; font-size: 16px; text-shadow: 0 0 10px rgba(255,45,149,.6); }
  .mchip span b { color: var(--cy); text-shadow: 0 0 10px rgba(34,232,255,.5); }

  /* achievements grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .badge { position: relative; padding: 12px 8px 10px; text-align: center; background: rgba(18,26,56,.9); clip-path: var(--cut-s); box-shadow: inset 0 0 0 1px rgba(238,243,255,.1); min-height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .badge .hex { width: 46px; height: 46px; display: grid; place-items: center; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: rgba(238,243,255,.1); color: var(--dim); font-size: 13px; font-style: italic; font-weight: 900; letter-spacing: .02em; }
  .badge .bn { font-size: 11px; letter-spacing: .08em; font-style: italic; font-weight: 900; line-height: 1.1; color: var(--dim); }
  .badge .bd { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 9.5px; color: var(--dim); opacity: .7; line-height: 1.25; }
  .badge.un { box-shadow: inset 0 0 0 1px var(--line), 0 0 16px rgba(34,232,255,.15); }
  .badge.un .hex { background: linear-gradient(135deg, var(--cy), var(--mg)); color: #061018; box-shadow: 0 0 14px rgba(34,232,255,.6); }
  .badge.un .bn { color: #fff; }
  .badge.un .bd { color: var(--ink); }
  .badge .lock { position: absolute; right: 8px; top: 8px; width: 9px; height: 11px; border: 2px solid rgba(238,243,255,.3); border-top-width: 5px; border-radius: 2px 2px 0 0; opacity: .8; }
  .badge.un .lock { display: none; }

  /* tab bar */
  .tabs { position: relative; z-index: 1; display: flex; justify-content: center; gap: 2px; padding: 6px calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal));
    background: linear-gradient(180deg, rgba(18,26,56,.6), #0b1020); border-top: 1px solid rgba(34,232,255,.25); }
  .tab { flex: 1; max-width: 120px; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); clip-path: var(--cut-s); transition: background .15s, color .15s; }
  .tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab.on { color: #061018; background: var(--cy); box-shadow: 0 0 18px rgba(34,232,255,.45); font-weight: 900; }
  .tab .n { position: absolute; } 

  /* ---------------- PAUSE + DEATH cards */
  #paused, #dead { align-items: center; justify-content: center; padding: calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal)); background: rgba(11,16,32,.62); }
  #paused { z-index: 30; }
  #dead { z-index: 25; background: linear-gradient(180deg, rgba(11,16,32,.45), rgba(11,16,32,.92)); }
  .card2 { position: relative; width: min(100%, 400px); padding: 22px 20px 20px; animation: rise .18s; }
  .card2 h1 { margin: 0; font-size: clamp(40px, 12vw, 54px); line-height: .9; font-weight: 900; font-style: italic; color: #fff; letter-spacing: .02em; transform: skewX(-8deg); text-shadow: 0 0 20px rgba(34,232,255,.5), 0 3px 0 rgba(0,0,0,.6); }
  .card2 h1.red { text-shadow: 0 0 20px rgba(255,45,149,.6), 0 3px 0 rgba(0,0,0,.6); }
  .card2 .tag { font-size: 11px; letter-spacing: .34em; color: var(--mg); text-transform: uppercase; margin: 6px 0 14px; }
  .card2 .tag.cy { color: var(--cy); }
  .card2 .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
  .card2 .stats div { font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); background: rgba(11,16,32,.55); padding: 8px 6px; clip-path: var(--cut-s); text-align: center; }
  .card2 .stats b { display: block; font-weight: 900; font-style: italic; font-size: clamp(18px, 5.4vw, 26px); color: #fff; margin-bottom: 3px; letter-spacing: 0; }
  .card2 .stats .c b { color: var(--am); } .card2 .stats .s b { color: var(--cy); }
  #d-newbest { display: none; color: var(--am); font-size: 13px; letter-spacing: .34em; text-transform: uppercase; margin: -4px 0 10px; text-shadow: 0 0 12px rgba(255,179,0,.7); animation: pulse 1s infinite; font-style: italic; font-weight: 900; text-align: center; }
  #d-newbest.on { display: block; }
  .missions { text-align: left; font-size: 12px; letter-spacing: .04em; margin-bottom: 14px; }
  .missions .mhead { text-transform: uppercase; letter-spacing: .24em; font-size: 10px; color: var(--cy); margin-bottom: 6px; }
  .missions .m { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px solid rgba(238,243,255,.1); color: var(--dim); }
  .missions .m em { font-style: normal; white-space: nowrap; color: var(--cy); }
  .missions .m.done { color: var(--am); } .missions .m.done em { color: var(--am); }
  .btns { display: flex; flex-direction: column; gap: 8px; }
  .btns.two { flex-direction: row; }
  .btns.two .abtn { flex: 1; font-size: 15px; letter-spacing: .12em; text-indent: .12em; padding: 12px 8px; white-space: nowrap; }
  .pmenu .abtn { text-align: left; display: flex; justify-content: space-between; align-items: center; }
  .pmenu .abtn small { font-size: 11px; letter-spacing: .2em; opacity: .75; }
  .pmenu .abtn small.off { color: var(--mg); opacity: 1; }
  .card2 .hint { font-size: 10px; letter-spacing: .24em; color: var(--dim); text-transform: uppercase; text-align: center; margin-top: 12px; }

  @media (min-aspect-ratio: 4/3) {
    #home .hh { padding-top: calc(10px + var(--sat)); }
    .wordmark span { font-size: 26px; } .wordmark span + span { font-size: 22px; }
    .card .art { height: clamp(120px, 30vh, 170px); }
    .card .mono { font-size: clamp(90px, 24vh, 130px); }
    .card .story { -webkit-line-clamp: 3; min-height: 2.6em; }
    #startb { min-height: 56px; font-size: 20px; }
    .tabs { padding-top: 4px; } .tab { min-height: 50px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>

<!-- HOME: header (wordmark, best, bank) / one pane per tab (src/home.js fills them) / tab bar -->
<div class="screen on" id="home">
  <div class="stripes"></div>
  <header class="hh">
    <div class="wordmark d"><span>Alpha</span><span>Rush</span></div>
    <div class="chips">
      <div class="chip best"><i>BEST</i><b class="num" id="h-best">0</b></div>
      <div class="chip bank"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.5 4.5h17v3.4h-6.2v8.1c0 1.5.8 2.3 2.3 2.3h2.6v3.2h-3.4c-3.4 0-5.3-1.9-5.3-5.3V7.9H3.5z"/></svg>BANK</i><b class="num" id="h-bank">0</b></div>
    </div>
  </header>
  <main class="hbody">
    <section class="pane on" id="pane-players">
      <div class="phead"><b>Select your runner</b><em id="h-who">1 / 3</em></div>
      <div class="car" id="h-car"><button class="arrow l" id="h-prev" type="button" aria-label="Previous">&#8249;</button><div class="track" id="h-track"></div><button class="arrow r" id="h-next" type="button" aria-label="Next">&#8250;</button></div>
      <div class="dots" id="h-dots"></div>
      <button class="abtn cy stripe" id="startb" type="button" disabled>Run</button>
      <div id="loadline">loading</div>
    </section>
    <section class="pane scroll" id="pane-missions"></section>
    <section class="pane scroll" id="pane-tasks"></section>
    <section class="pane scroll" id="pane-achievements"></section>
    <section class="pane scroll" id="pane-powerups"></section>
  </main>
  <nav class="tabs" id="h-tabs"></nav>
</div>

<!-- DEATH card -->
<div class="screen" id="dead">
  <div class="panel card2">
    <h1 class="red" id="d-h1">CAUGHT</h1>
    <div class="tag" id="d-tag">the pack got you</div>
    <div class="stats">
      <div class="s"><b class="num" id="d-score">0</b>score</div>
      <div><b class="num" id="d-dist">0 m</b>distance</div>
      <div class="c"><b class="num" id="d-coins">0</b>coins</div>
      <div><b class="num" id="d-best">0</b>best</div>
    </div>
    <div id="d-newbest">new best</div>
    <div class="missions" id="d-missions"></div>
    <div class="btns two">
      <button class="abtn cy" id="restartb" type="button">Run again</button>
      <button class="abtn" id="d-home" type="button">Home</button>
    </div>
    <div id="loadline2"></div>
  </div>
</div>

<!-- PAUSE menu: RESUME (also Esc / tap outside), RESTART, SOUND, HOME -->
<div class="screen" id="paused">
  <div class="panel card2 pmenu">
    <h1>PAUSED</h1>
    <div class="tag cy">Esc or tap outside to resume</div>
    <div class="stats" style="grid-template-columns:1fr 1fr">
      <div class="s"><b class="num" id="p-score">0</b>score</div>
      <div><b class="num" id="p-dist">0 m</b>distance</div>
    </div>
    <div class="btns">
      <button class="abtn cy" id="resumeb" type="button">Resume <small>Esc</small></button>
      <button class="abtn" id="p-restart" type="button">Restart <small>same seed</small></button>
      <button class="abtn" id="soundb" type="button">Sound <small id="soundv">on</small></button>
      <button class="abtn" id="p-home" type="button">Home <small>quit run</small></button>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js?v=202609240459"></script>
</body>
</html>
