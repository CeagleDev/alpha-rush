<!doctype html>
<html lang="en">

<!-- The one network dependency. Same CDN and version as assetlib.js / rig.js resolve their bare
     'three' and 'three/addons/' specifiers through, so there is exactly ONE copy of three. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<style>
  /* ALPHA RUSH front end, pass 2 (work/v2/UI2_BRIEF.md) + pass 3 showcase (work/v2/UI3_BRIEF.md). Depth everywhere: every panel is a layered chamfered
     card (.pc = glow wrapper > .pe = 1 px gradient edge > .pi = gradient fill with an inner highlight), buttons
     are bevelled with a press state, a diagonal speed-stripe field drifts behind every screen (transform only,
     GPU-cheap), a soft vignette sits over it. Cyan / magenta / amber on deep navy, heavy italic condensed system
     type, no web fonts, inline SVG icons only (home.js / hud.js draw them). Motion: CSS only, <= 200 ms except
     the slow stripe drift and the short HUD banners. */
  :root {
    --cy: #22e8ff; --mg: #ff2d95; --am: #ffb300; --navy: #0b1020; --navy2: #121a38; --navy3: #1a2450; --ink: #eef3ff; --dim: rgba(238,243,255,.62);
    --line: rgba(34,232,255,.3); --red: #ff3b4a; --gold: #ffd24a;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    --disp: "Avenir Next Condensed", "Roboto Condensed", sans-serif-condensed, "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --cut: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    --cut-s: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    --cut-x: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
    --fill: linear-gradient(168deg, #1b2656 0%, #121a38 46%, #0c1229 100%);
    --edge: linear-gradient(160deg, rgba(34,232,255,.85) 0%, rgba(34,232,255,.25) 35%, rgba(255,45,149,.35) 70%, rgba(34,232,255,.6) 100%);
    --glow: rgba(34,232,255,.22);
    --ac: var(--cy);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--navy); color: var(--ink);
    font-family: var(--disp); font-weight: 700; -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; }
  canvas#c { display: block; width: 100%; height: 100%; touch-action: none; position: fixed; inset: 0; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; }
  svg { display: block; }
  .d { font-family: var(--disp); font-weight: 900; font-style: italic; letter-spacing: .01em; text-transform: uppercase; }
  .num { font-variant-numeric: tabular-nums; }
  @keyframes drift { from { transform: translate3d(0,0,0); } to { transform: translate3d(-56.57px,0,0); } }
  @keyframes sweep { from { transform: translate3d(-100%,0,0); } to { transform: translate3d(100%,0,0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes punch { from { transform: scale(1.15); } to { transform: scale(1); } }
  @keyframes flare { 0% { transform: skewX(-10deg) scale(1.4); box-shadow: 0 0 30px 6px rgba(255,255,255,.7); } 100% { transform: skewX(-10deg) scale(1); } }
  @keyframes banner { 0% { transform: translate3d(110vw,0,0) skewX(-12deg); opacity: 0; } 11% { transform: translate3d(0,0,0) skewX(-12deg); opacity: 1; }
    82% { transform: translate3d(0,0,0) skewX(-12deg); opacity: 1; } 100% { transform: translate3d(-110vw,0,0) skewX(-12deg); opacity: 0; } }
  @keyframes mile { 0% { transform: translateX(-50%) scale(.6); opacity: 0; } 18% { transform: translateX(-50%) scale(1.15); opacity: 1; } 40% { transform: translateX(-50%) scale(1); }
    80% { opacity: 1; } 100% { transform: translateX(-50%) scale(1.05); opacity: 0; } }
  @keyframes streak { from { transform: scale(1.25) skewX(-10deg); } to { transform: scale(1) skewX(-10deg); } }
  @keyframes shimmer { from { background-position: 0 0; } to { background-position: 200px 0; } }
  @keyframes glowpulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ---------------- shared: the layered card, bevelled buttons, headers */
  .pc { position: relative; }
  .pc::before { content: ""; position: absolute; inset: 8px; z-index: 0; box-shadow: 0 0 24px 6px var(--glow); pointer-events: none; }
  .pc > .pe { position: relative; z-index: 1; clip-path: var(--cut); padding: 1px; background: var(--edge); height: 100%; }
  .pc > .pe > .pi { position: relative; clip-path: var(--cut); background: var(--fill); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(0,0,0,.5); height: 100%; overflow: hidden; }
  .pc.s > .pe, .pc.s > .pe > .pi { clip-path: var(--cut-s); }
  .pc.s::before { inset: 5px; box-shadow: 0 0 16px 3px var(--glow); }
  /* accent stripes at 12 % inside a card (top-right corner) */
  .pi::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 120px; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(-55deg, var(--ac) 0 6px, transparent 6px 22px); opacity: .12; transform: skewX(-20deg); }
  .pi > * { position: relative; z-index: 1; }
  .bw { position: relative; }
  .bw::before { content: ""; position: absolute; inset: 8px; z-index: 0; box-shadow: 0 0 26px 6px var(--glow); pointer-events: none; }
  .bw > .abtn { position: relative; z-index: 1; }
  .abtn { display: block; width: 100%; min-height: 56px; padding: 12px 20px; color: var(--ink); clip-path: var(--cut-s); font-size: 17px; letter-spacing: .22em; text-indent: .22em;
    text-transform: uppercase; font-weight: 900; font-style: italic; --btn: #1b2656;
    background: linear-gradient(180deg, rgba(255,255,255,.16) 0, rgba(255,255,255,.04) 42%, rgba(0,0,0,.18) 58%, rgba(0,0,0,.34) 100%), var(--btn);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.4), inset 0 0 0 1px rgba(34,232,255,.3);
    transition: transform .12s, box-shadow .12s, filter .12s; }
  .abtn:active { transform: translateY(2px) scale(.985); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(0,0,0,.4), inset 0 0 0 1px rgba(34,232,255,.5); filter: brightness(1.18); }
  .abtn.cy { --btn: var(--cy); color: #061018; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(0,40,60,.45); }
  .abtn.mg { --btn: var(--mg); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(60,0,30,.45); }
  .abtn.am { --btn: var(--am); color: #1a1200; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(60,40,0,.45); }
  .abtn[disabled] { opacity: .45; filter: saturate(.3); }
  .abtn.stripe { background-image: repeating-linear-gradient(-55deg, rgba(255,255,255,.18) 0 10px, transparent 10px 26px), linear-gradient(180deg, rgba(255,255,255,.16) 0, rgba(255,255,255,.04) 42%, rgba(0,0,0,.18) 58%, rgba(0,0,0,.34) 100%); }
  .abtn svg { width: 20px; height: 20px; flex: 0 0 auto; }
  .phead { position: relative; display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: .3em; color: var(--cy); text-transform: uppercase; margin: 6px 4px 14px; padding-bottom: 8px; }
  .phead b { font-style: italic; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 0 12px rgba(34,232,255,.4); display: flex; align-items: center; gap: 8px; }
  .phead b svg { width: 20px; height: 20px; fill: none; stroke: var(--cy); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px rgba(34,232,255,.7)); }
  .phead em { font-style: normal; color: var(--dim); letter-spacing: .12em; font-size: 11px; }
  .phead::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
    background: linear-gradient(90deg, var(--cy) 0 72px, transparent 72px 80px, var(--mg) 80px 104px, transparent 104px 110px, rgba(34,232,255,.35) 110px 122px, transparent 122px); transform: skewX(-30deg); transform-origin: left; }

  /* ============================================================ HUD (in play), built by src/hud.js */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none;
    padding: calc(8px + var(--sat)) calc(10px + var(--sar)) calc(8px + var(--sab)) calc(10px + var(--sal)); }
  #hud.on { display: block; }
  #hud .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  #hud .lbl { font-size: 10px; letter-spacing: .32em; color: var(--cy); text-shadow: 0 0 8px rgba(34,232,255,.7); }
  #hud .scorerow { display: flex; align-items: center; gap: 8px; }
  #hud .score { font-size: clamp(38px, 11vw, 52px); line-height: .95; letter-spacing: -.01em; color: #fff; transform-origin: left center;
    text-shadow: 0 2px 0 rgba(0,0,0,.8), 0 0 18px rgba(34,232,255,.55); }
  #hud .score.punch { animation: punch .12s ease-out; }
  #hud .mult { font-size: 15px; padding: 3px 10px 3px 8px; background: linear-gradient(180deg, #ff6ab5, var(--mg) 55%, #c4136a); color: #fff; clip-path: var(--cut-s);
    box-shadow: 0 0 14px rgba(255,45,149,.7), inset 0 1px 0 rgba(255,255,255,.4); transform: skewX(-10deg); }
  #hud .mult.hot { background: linear-gradient(180deg, #ffd670, var(--am) 55%, #c98a00); color: #1a1200; box-shadow: 0 0 16px rgba(255,179,0,.9), inset 0 1px 0 rgba(255,255,255,.5); }
  #hud .mult.flare { animation: flare .3s ease-out; }
  #hud .dist { font-size: 15px; letter-spacing: .06em; color: var(--cy); margin-top: 3px; text-shadow: 0 1px 0 #000, 0 0 10px rgba(34,232,255,.5); }
  #hud .dist small { font-size: 10px; letter-spacing: .3em; color: var(--dim); margin-left: 4px; }
  #hud .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #hud .pauseb { pointer-events: auto; width: 48px; height: 48px; display: grid; place-items: center; clip-path: var(--cut-s);
    background: linear-gradient(180deg, rgba(40,52,100,.85), rgba(11,16,32,.85)); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 2px var(--line); }
  #hud .pauseb:active { background: rgba(34,232,255,.35); }
  #hud .pauseb i { display: block; width: 16px; height: 18px; background: linear-gradient(90deg, var(--cy) 0 5px, transparent 5px 11px, var(--cy) 11px); transform: skewX(-10deg); filter: drop-shadow(0 0 4px var(--cy)); }
  #hud .coins { display: flex; align-items: center; gap: 6px; font-size: clamp(22px, 6vw, 28px); color: var(--gold); padding: 3px 12px 3px 10px; clip-path: var(--cut-s);
    background: linear-gradient(180deg, rgba(40,52,100,.75), rgba(11,16,32,.8)); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 0 0 1px rgba(255,210,74,.35); text-shadow: 0 0 10px rgba(255,179,0,.6); }
  #hud .coins svg { width: .8em; height: .8em; filter: drop-shadow(0 0 4px rgba(255,179,0,.8)); }
  #hud .coins small { font-size: 9px; letter-spacing: .28em; color: rgba(255,210,74,.75); margin-left: 2px; align-self: flex-end; margin-bottom: 5px; }
  #hud .streak { display: none; font-size: 12px; letter-spacing: .18em; color: #fff; padding: 4px 10px; clip-path: var(--cut-s); transform: skewX(-10deg); transform-origin: right center;
    background: linear-gradient(180deg, #ff6ab5, var(--mg) 60%, #c4136a); box-shadow: 0 0 14px rgba(255,45,149,.8), inset 0 1px 0 rgba(255,255,255,.4); }
  #hud .streak.on { display: block; animation: streak .14s ease-out; }
  /* active power-up badges: icon in a coloured disc with a draining ring */
  #hud .badges { display: flex; gap: 8px; margin-top: 10px; }
  #hud .bd { display: none; position: relative; width: 50px; height: 50px; }
  #hud .bd.on { display: block; animation: rise .18s; }
  #hud .bd svg.ring { position: absolute; inset: 0; width: 50px; height: 50px; transform: rotate(-90deg); }
  #hud .bd svg.ring circle { fill: rgba(11,16,32,.75); stroke: var(--pc); stroke-width: 3.5; stroke-linecap: butt; }
  #hud .bd svg.ring circle.bg { stroke: rgba(238,243,255,.15); }
  #hud .bd svg.ring circle.fg { filter: drop-shadow(0 0 3px var(--pc)); transition: stroke-dashoffset .1s linear; }
  #hud .bd svg.ico { position: absolute; left: 12px; top: 12px; width: 26px; height: 26px; }
  #hud .bd .t { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); font-size: 10px; letter-spacing: .05em; color: #fff; text-shadow: 0 1px 0 #000, 0 0 6px var(--pc); font-style: italic; font-weight: 900; }
  #hud .banner { position: absolute; left: 0; right: 0; top: 24%; display: none; justify-content: center; }
  #hud .banner.on { display: flex; }
  #hud .banner i { display: block; font-style: italic; font-weight: 900; font-size: clamp(14px, 4vw, 18px); letter-spacing: .22em; text-transform: uppercase; color: #061018; padding: 10px 26px 10px 22px; white-space: nowrap;
    background: linear-gradient(180deg, #9ff6ff, var(--cy) 50%, #0fb9cf); clip-path: var(--cut-s); box-shadow: 0 0 26px rgba(34,232,255,.7), inset 0 1px 0 rgba(255,255,255,.7); animation: banner 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
  #hud .banner i b { color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
  #hud .banner.gold i { background: linear-gradient(180deg, #fff0a8, var(--gold) 45%, #d89a00); color: #2a1a00; box-shadow: 0 0 34px rgba(255,210,74,.9), inset 0 1px 0 rgba(255,255,255,.8); }
  #hud .banner.gold i b { color: #fff; text-shadow: 0 1px 0 rgba(120,70,0,.7); }
  #hud .mile { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); display: none; font-size: clamp(40px, 13vw, 64px); font-style: italic; font-weight: 900; color: #fff; letter-spacing: .02em; white-space: nowrap;
    text-shadow: 0 3px 0 rgba(0,0,0,.7), 0 0 26px rgba(34,232,255,.9), 0 0 60px rgba(255,45,149,.6); }
  #hud .mile small { display: block; text-align: center; font-size: 12px; letter-spacing: .4em; color: var(--cy); }
  #hud .mile.on { display: block; animation: mile 1.1s ease-out forwards; }
  #hud .toast { position: absolute; left: 50%; top: calc(178px + var(--sat)); transform: translateX(-50%) translateY(-8px); max-width: 88vw; text-align: center;
    font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #061018; background: linear-gradient(180deg, #9ff6ff, var(--cy) 50%, #0fb9cf); padding: 9px 18px; clip-path: var(--cut-s);
    box-shadow: 0 0 22px rgba(34,232,255,.6), inset 0 1px 0 rgba(255,255,255,.7); opacity: 0; transition: opacity .18s, transform .18s; font-weight: 900; font-style: italic; }
  #hud .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #hud .toast.ach { background: linear-gradient(180deg, #ff6ab5, var(--mg) 50%, #c4136a); color: #fff; box-shadow: 0 0 22px rgba(255,45,149,.7), inset 0 1px 0 rgba(255,255,255,.4); }
  /* speed gauge: an SVG arc, km/h inside */
  #hud .gauge { position: absolute; left: calc(6px + var(--sal)); bottom: calc(4px + var(--sab)); width: 124px; height: 84px; }
  #hud .gauge svg { width: 124px; height: 84px; overflow: visible; }
  #hud .gauge .arcbg { fill: none; stroke: rgba(238,243,255,.16); stroke-width: 9; stroke-linecap: butt; }
  #hud .gauge .arc { fill: none; stroke: url(#g-speed); stroke-width: 9; stroke-linecap: butt; transition: stroke-dashoffset .12s linear; filter: drop-shadow(0 0 4px rgba(34,232,255,.7)); }
  #hud .gauge .ticks { fill: none; stroke: rgba(238,243,255,.5); stroke-width: 2; }
  #hud .gauge .v { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 30px; line-height: .9; color: #fff; text-shadow: 0 2px 0 #000, 0 0 14px rgba(34,232,255,.6); }
  #hud .gauge .v small { display: block; font-size: 9px; letter-spacing: .32em; color: var(--cy); margin-top: 3px; }
  #hud .pack { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(22px + var(--sab)); width: min(190px, 46vw); }
  #hud .pack .plbl { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 10px; letter-spacing: .32em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
  #hud .pack .plbl svg { width: 16px; height: 16px; fill: currentColor; }
  #hud .pack .bar { height: 9px; background: rgba(11,16,32,.7); clip-path: var(--cut-s); overflow: hidden; transform: skewX(-14deg); box-shadow: inset 0 0 0 1px rgba(238,243,255,.14); }
  #hud .pack .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd670, var(--am)); box-shadow: 0 0 8px var(--am); transition: width .12s linear; }
  #hud .pack.hot .fill { background: linear-gradient(90deg, #ff8a90, var(--red)); box-shadow: 0 0 10px var(--red); }
  #hud .pack.hot .plbl { color: var(--red); animation: pulse .5s infinite; }
  #hud .perf { position: absolute; right: calc(10px + var(--sar)); bottom: calc(8px + var(--sab)); font: 10px var(--mono); opacity: .45; letter-spacing: .06em; }
  /* SURGE: energy bar across the top, screen-edge glow */
  #hud .surgebar { position: absolute; left: 0; right: 0; top: 0; height: 7px; display: none; overflow: hidden; background: rgba(11,16,32,.6); box-shadow: 0 0 18px rgba(34,232,255,.8); }
  #hud .surgetag { position: absolute; left: 50%; top: 10px; transform: translateX(-50%) skewX(-10deg); display: none; font-size: 10px; letter-spacing: .36em; text-indent: .36em; color: #061018; padding: 3px 12px; clip-path: var(--cut-x); background: linear-gradient(90deg, var(--cy), #ff8ac4); box-shadow: 0 0 16px rgba(34,232,255,.8); font-style: italic; font-weight: 900; animation: glowpulse .6s ease-in-out infinite; }
  #hud.surge .surgetag { display: block; }
  #hud .surgebar b { display: block; height: 100%; width: 100%; transform-origin: left; background: linear-gradient(90deg, var(--cy), var(--mg), var(--cy)); background-size: 200px 100%; animation: shimmer .8s linear infinite; box-shadow: 0 0 12px var(--cy); }
  #hud .edge { position: absolute; inset: 0; display: none; box-shadow: inset 0 0 70px rgba(34,232,255,.45), inset 0 0 26px rgba(255,45,149,.35); animation: glowpulse .6s ease-in-out infinite; }
  #hud.surge .surgebar, #hud.surge .edge { display: block; }

  /* ============================================================ screens (home, pause, death) */
  .screen { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; color: var(--ink); overflow: hidden; }
  .screen.on { display: flex; }
  .field { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .field i { position: absolute; top: -10%; bottom: -10%; left: 0; width: calc(100% + 120px); will-change: transform; animation: drift 2.4s linear infinite;
    background: repeating-linear-gradient(-45deg, rgba(34,232,255,.075) 0 12px, transparent 12px 40px); }
  .field i + i { animation-duration: 5s; background: repeating-linear-gradient(-45deg, rgba(255,45,149,.05) 0 4px, transparent 4px 40px); }
  .field::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 45%, transparent 40%, rgba(4,6,16,.72) 100%); }
  .field::before { content: ""; position: absolute; left: -10%; right: -10%; top: -6%; height: 34%; z-index: 0;
    background: linear-gradient(100deg, transparent 38%, rgba(34,232,255,.16) 38.5%, rgba(34,232,255,.16) 46%, transparent 46.5%, transparent 52%, rgba(255,45,149,.18) 52.5%, rgba(255,45,149,.18) 56%, transparent 56.5%); }

  /* ---------------- HOME */
  #home { background: linear-gradient(180deg, rgba(11,16,32,.86) 0%, rgba(11,16,32,.94) 40%, #0b1020 100%); z-index: 20; }
  #home .hh { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: calc(8px + var(--sat)) calc(14px + var(--sar)) 6px calc(14px + var(--sal)); }
  .wordmark { display: flex; align-items: baseline; gap: 6px; line-height: .9; transform: skewX(-8deg); }
  .wordmark span { font-size: 28px; font-weight: 900; font-style: italic; letter-spacing: .04em; color: #fff; text-shadow: 0 0 18px rgba(34,232,255,.55), 0 2px 0 rgba(0,0,0,.6); }
  .wordmark span + span { color: var(--cy); font-size: 24px; letter-spacing: .22em; text-shadow: 0 0 18px rgba(34,232,255,.8); }
  .chips { display: flex; gap: 8px; }
  .chip { display: flex; flex-direction: column; align-items: flex-end; padding: 4px 12px 4px 10px; clip-path: var(--cut-s); min-width: 78px;
    background: linear-gradient(168deg, #1b2656, #0f1630); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px var(--line); }
  .chip i { font-style: normal; font-size: 9px; letter-spacing: .3em; color: var(--dim); display: flex; align-items: center; gap: 4px; }
  .chip b { font-size: 18px; line-height: 1; font-style: italic; font-weight: 900; color: #fff; }

  #home .hbody { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch;

  /* ---------------- the SHOWCASE (UI pass 3, work/v2/UI3_BRIEF.md): the live hero fills the pane edge to edge
     (src/showcase.js renders into #h-turntable, which just follows this box), the character's colour theme glows

     then the WARDROBE row (three outfit chips + four round colour swatches) above RUN. */
  .show { position: relative; flex: 1; min-height: 0; margin: 0 calc(-12px - var(--sar)) 0 calc(-12px - var(--sal)); overflow: hidden; touch-action: pan-y;

    background: radial-gradient(ellipse 46% 52% at 50% 60%, color-mix(in srgb, var(--c2) 44%, transparent) 0%, color-mix(in srgb, var(--c1) 34%, transparent) 40%, transparent 74%); }
  .show .beam { position: absolute; left: 50%; top: -20%; width: 34%; height: 150%; transform: translateX(-50%) skewX(-16deg); pointer-events: none; opacity: .5;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c2) 16%, transparent) 30%, color-mix(in srgb, var(--c2) 24%, transparent) 50%, color-mix(in srgb, var(--c2) 16%, transparent) 70%, transparent); }
  .show .floor { position: absolute; left: 18%; right: 18%; bottom: 3%; height: 9%; border-radius: 50%; pointer-events: none;

  .show .pager { position: absolute; z-index: 4; left: calc(12px + var(--sal)); top: 8px; display: flex; align-items: center; gap: 8px; font-size: 9px; letter-spacing: .32em; text-transform: uppercase; color: var(--dim); pointer-events: none; }
  .show .pager b { font-size: 15px; letter-spacing: .06em; color: #fff; font-style: italic; font-weight: 900; text-shadow: 0 0 10px var(--c2); }
  .show .pager::after { content: ""; width: 34px; height: 3px; background: var(--c2); transform: skewX(-30deg); box-shadow: 0 0 8px var(--c2); }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 4; width: 48px; height: 68px; display: grid; place-items: center;
    background: linear-gradient(180deg, rgba(40,52,100,.85), rgba(11,16,32,.85)); clip-path: var(--cut-s); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 2px var(--line); color: var(--cy); font-size: 28px; font-weight: 900; }

  .arrow.l { left: 0; } .arrow.r { right: 0; }
  .dots { position: absolute; z-index: 4; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 8px; pointer-events: none; }
  .dots i { width: 22px; height: 5px; background: rgba(238,243,255,.2); transform: skewX(-20deg); transition: background .15s; }
  .dots i.on { background: var(--c2); box-shadow: 0 0 8px var(--c2); }
  /* name / title / story under the hero: nothing else */
  .hinfo { text-align: center; padding: 6px 4px 0; --c2: #ff2d3a; }
  .hinfo .name { font-size: clamp(40px, 12vw, 58px); line-height: .92; font-weight: 900; font-style: italic; color: #fff; letter-spacing: .02em; transform: skewX(-6deg); text-shadow: 0 0 18px var(--c2), 0 3px 0 rgba(0,0,0,.55); }
  .hinfo .title { font-size: 11px; letter-spacing: .38em; text-indent: .38em; color: var(--c2); margin-top: 5px; text-transform: uppercase; text-shadow: 0 0 10px color-mix(in srgb, var(--c2) 60%, transparent); }
  .hinfo .story { font-family: var(--body); font-weight: 400; font-size: 13px; line-height: 1.35; color: var(--dim); margin: 6px auto 0; max-width: 340px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  /* the WARDROBE row: three outfit chips, four round colour swatches painted with the palette's three colours */
  .ward { display: flex; flex-direction: column; gap: 5px; margin: 8px 0 0; }
  .ward[hidden] { display: none; }
  .ward .outfits { display: flex; gap: 6px; }
  .ofit { flex: 1; min-width: 0; min-height: 40px; padding: 4px 6px; clip-path: var(--cut-x); background: rgba(6,9,20,.55); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(238,243,255,.16);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--dim); transition: background .15s, color .15s; }
  .ofit b { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-style: italic; font-weight: 900; line-height: 1.1; text-align: center; }
  .ofit small { font-size: 7px; letter-spacing: .22em; text-transform: uppercase; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .ofit.on { color: #061018; background: linear-gradient(180deg, #9ff6ff, var(--cy) 45%, #0fb9cf); box-shadow: 0 0 14px rgba(34,232,255,.45), inset 0 1px 0 rgba(255,255,255,.7); }
  .ofit.on small { opacity: .8; }

  .sw { position: relative; width: 48px; height: 48px; display: grid; place-items: center; }
  .sw::before { content: ""; width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--s1) 0 33%, var(--s2) 33% 66%, var(--s3) 66%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), inset 0 -6px 10px -6px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.6); transition: transform .12s, box-shadow .12s; }
  .sw:active::before { transform: scale(.92); }
  .sw.on::before { transform: scale(1.06); box-shadow: 0 0 0 2px var(--navy), 0 0 0 4px var(--cy), 0 0 16px rgba(34,232,255,.75), inset 0 0 0 1px rgba(255,255,255,.3); }
  .sw::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity .12s; box-shadow: 0 0 4px #000; }

  /* locations strip (ACHIEVEMENTS tab, top) */

  .loc span { font-size: 7.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); font-style: italic; font-weight: 900; line-height: 1.1; max-width: 100%; min-height: 2.2em; display: flex; align-items: center; justify-content: center; text-align: center; }

  /* rows: missions / tasks (layered cards with an icon column) */
  .row { margin-bottom: 10px; --glow: rgba(34,232,255,.14); }

  .row .ico { flex: 0 0 62px; display: grid; place-items: center; background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 30%, #121a38), color-mix(in srgb, var(--ac) 12%, #0c1229)); border-right: 1px solid color-mix(in srgb, var(--ac) 40%, transparent); }
  .row .ico svg { width: 34px; height: 34px; fill: none; stroke: var(--ac); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px var(--ac)); }
  .row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 11px 12px 11px 12px; }

  .row .bar { height: 9px; background: rgba(6,9,20,.7); clip-path: var(--cut-s); overflow: hidden; transform: skewX(-14deg); box-shadow: inset 0 0 0 1px rgba(238,243,255,.08); }
  .row .bar b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--ac) 60%, #fff), var(--ac)); box-shadow: 0 0 10px var(--ac); transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .row.done { --ac: var(--am); --glow: rgba(255,179,0,.2); }

  .row .pay { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; font-size: 10px; letter-spacing: .16em; color: #1a1200; padding: 3px 9px 3px 7px; clip-path: var(--cut-x);
    background: linear-gradient(180deg, #ffe08a, var(--gold) 55%, #d89a00); box-shadow: inset 0 1px 0 rgba(255,255,255,.6); font-style: italic; font-weight: 900; text-transform: uppercase; }
  .row .pay svg { width: 11px; height: 11px; }

  .row .desc { font-family: var(--body); font-weight: 400; font-size: 12px; color: var(--dim); line-height: 1.35; }
  /* missions: the multiplier badge, the reward line, the next-set preview */
  .mhead { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .mbadge { flex: 0 0 auto; width: 74px; height: 74px; display: grid; place-items: center; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: linear-gradient(160deg, #ff6ab5, var(--mg) 50%, #9a0d55); color: #fff; font-size: 28px; font-style: italic; font-weight: 900; line-height: 1; position: relative; }
  .mbadge::after { content: "MULT"; position: absolute; bottom: 8px; font-size: 7px; letter-spacing: .3em; color: rgba(255,255,255,.75); font-style: normal; }
  .mbadgew { position: relative; flex: 0 0 auto; }

  .mstat { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .mstat div { padding: 8px 10px; clip-path: var(--cut-s); background: linear-gradient(168deg, #1b2656, #0f1630); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px var(--line); font-size: 8.5px; letter-spacing: .26em; color: var(--dim); text-transform: uppercase; }
  .mstat b { display: block; font-size: 20px; line-height: 1; font-style: italic; font-weight: 900; color: #fff; margin-bottom: 3px; letter-spacing: 0; }
  .mstat .set b { color: var(--cy); text-shadow: 0 0 10px rgba(34,232,255,.5); }
  .reward { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin: 2px 0 12px; clip-path: var(--cut-s); background: linear-gradient(90deg, rgba(255,45,149,.22), rgba(34,232,255,.12));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1px rgba(255,45,149,.35); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }

  .ladder div.past { color: var(--ink); background: linear-gradient(180deg, #2b3a70, #1b2656); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1px var(--line); }
  .ladder div.now { color: #fff; background: linear-gradient(180deg, #ff6ab5, var(--mg) 55%, #c4136a); box-shadow: 0 0 16px rgba(255,45,149,.6), inset 0 1px 0 rgba(255,255,255,.4); transform: scale(1.12); }

    background: linear-gradient(180deg, rgba(255,255,255,.28) 0, rgba(255,255,255,.05) 45%, rgba(0,0,0,.15) 55%, rgba(0,0,0,.3) 100%), var(--pc);

  .badge.un .bd { color: var(--ink); }
  .badge.un .rw { color: #1a1200; background: linear-gradient(180deg, #ffe08a, var(--gold) 55%, #d89a00); box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }
  .badge .lock { position: absolute; right: 8px; top: 8px; width: 12px; height: 12px; fill: none; stroke: rgba(238,243,255,.45); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; z-index: 2; }
  .badge.un .lock { display: none; }
  .badge:not(.un) .pe { background: linear-gradient(160deg, rgba(238,243,255,.18), rgba(238,243,255,.05)); }
  .badge:not(.un) .pi { filter: saturate(.4); }

  /* tab bar */
  .tabs { position: relative; z-index: 1; display: flex; justify-content: center; gap: 2px; padding: 6px calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal));
    background: linear-gradient(180deg, rgba(18,26,56,.6), #0b1020); border-top: 1px solid rgba(34,232,255,.25); box-shadow: 0 -1px 0 rgba(255,255,255,.06); }
  .tab { flex: 1; max-width: 120px; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); clip-path: var(--cut-s); transition: background .15s, color .15s; }
  .tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab.on { color: #061018; font-weight: 900; background: linear-gradient(180deg, #9ff6ff, var(--cy) 45%, #0fb9cf); box-shadow: 0 0 18px rgba(34,232,255,.45), inset 0 1px 0 rgba(255,255,255,.7); }
  .tab.on svg { filter: drop-shadow(0 0 2px rgba(255,255,255,.6)); }

  /* ---------------- PAUSE + DEATH cards */
  #paused, #dead { align-items: center; justify-content: center; padding: calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal)); background: rgba(11,16,32,.62); }
  #paused { z-index: 30; }
  #dead { z-index: 25; background: linear-gradient(180deg, rgba(11,16,32,.45), rgba(11,16,32,.92)); }
  .card2 { width: min(100%, 400px); animation: rise .18s; --glow: rgba(34,232,255,.3); }
  .card2 .pi { padding: 22px 20px 20px; }
  .card2.red { --glow: rgba(255,45,149,.3); }
  .card2.red .pi { --ac: var(--mg); }
  .card2 h1 { margin: 0; font-size: clamp(40px, 12vw, 54px); line-height: .9; font-weight: 900; font-style: italic; color: #fff; letter-spacing: .02em; transform: skewX(-8deg); text-shadow: 0 0 20px rgba(34,232,255,.5), 0 3px 0 rgba(0,0,0,.6); }
  .card2 h1.red { text-shadow: 0 0 20px rgba(255,45,149,.6), 0 3px 0 rgba(0,0,0,.6); }
  .card2 .tag { font-size: 11px; letter-spacing: .34em; color: var(--mg); text-transform: uppercase; margin: 6px 0 14px; }
  .card2 .tag.cy { color: var(--cy); }
  .card2 .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 12px; padding: 0; }
  .card2 .stats div { font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); padding: 8px 4px; clip-path: var(--cut-s); text-align: center;
    background: linear-gradient(180deg, rgba(6,9,20,.5), rgba(6,9,20,.8)); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(238,243,255,.08); }
  .card2 .stats b { display: block; font-weight: 900; font-style: italic; font-size: clamp(18px, 5.4vw, 26px); color: #fff; margin-bottom: 3px; letter-spacing: 0; }
  .card2 .stats .c b { color: var(--gold); text-shadow: 0 0 10px rgba(255,179,0,.5); } .card2 .stats .s b { color: var(--cy); text-shadow: 0 0 10px rgba(34,232,255,.5); }
  .card2 .stats i { display: inline-flex; align-items: center; justify-content: center; gap: 3px; font-style: normal; }
  .card2 .stats i svg { width: 9px; height: 9px; }
  #d-newbest { display: none; color: var(--gold); font-size: 13px; letter-spacing: .34em; text-transform: uppercase; margin: -4px 0 10px; text-shadow: 0 0 12px rgba(255,179,0,.7); animation: pulse 1s infinite; font-style: italic; font-weight: 900; text-align: center; }
  #d-newbest.on { display: block; }
  .missions { text-align: left; font-size: 12px; letter-spacing: .04em; margin-bottom: 14px; }
  .missions .mhd { text-transform: uppercase; letter-spacing: .24em; font-size: 10px; color: var(--cy); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .missions .m { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid rgba(238,243,255,.1); color: var(--dim); }
  .missions .m span { display: flex; align-items: center; gap: 7px; }
  .missions .m svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .missions .m em { font-style: normal; white-space: nowrap; color: var(--cy); font-weight: 900; }
  .missions .m.done { color: var(--am); } .missions .m.done em { color: var(--am); }
  .btns { display: flex; flex-direction: column; gap: 10px; }
  .btns.two { flex-direction: row; }
  .btns.two .bw { flex: 1; }
  .btns.two .abtn { font-size: 15px; letter-spacing: .12em; text-indent: .12em; padding: 12px 8px; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btns.two .abtn svg { fill: currentColor; width: 18px; height: 18px; }
  .pmenu .abtn { text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-indent: 0; }
  .pmenu .abtn > span { display: flex; align-items: center; gap: 10px; }
  .pmenu .abtn svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pmenu .abtn small { font-size: 11px; letter-spacing: .2em; opacity: .75; }
  .pmenu .abtn small.off { color: var(--mg); opacity: 1; }
  .card2 .hint { font-size: 10px; letter-spacing: .24em; color: var(--dim); text-transform: uppercase; text-align: center; margin-top: 12px; }

  @media (min-aspect-ratio: 4/3) {
    #home .hh { padding-top: calc(10px + var(--sat)); }
    .wordmark span { font-size: 24px; } .wordmark span + span { font-size: 20px; }
    .hinfo .story { -webkit-line-clamp: 2; font-size: 12px; }
    .hinfo .name { font-size: clamp(30px, 6vh, 44px); }
    .hinfo .title { margin-top: 3px; }
    .ward { margin: 6px 0 0; } .startw { margin-top: 6px; } .ofit { min-height: 36px; } .sw { width: 44px; height: 44px; } .sw::before { width: 32px; height: 32px; }
    .locs { margin-bottom: 6px; } .loc { padding: 5px 3px 4px; } .loc svg { width: 16px; height: 16px; }
    #startb { min-height: 54px; font-size: 20px; }
    .tabs { padding-top: 4px; } .tab { min-height: 48px; }
    #hud .badges { margin-top: 6px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>

<!-- HOME: header (wordmark, best, bank) / one pane per tab (src/home.js fills them; PLAYERS = the showcase) / tab bar -->
<div class="screen on" id="home">
  <div class="field"><i></i><i></i></div>
  <header class="hh">
    <div class="wordmark d"><span>Alpha</span><span>Rush</span></div>
    <div class="chips">
      <div class="chip best"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>BEST</i><b class="num" id="h-best">0</b></div>
      <div class="chip bank"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.5 4.5h17v3.4h-6.2v8.1c0 1.5.8 2.3 2.3 2.3h2.6v3.2h-3.4c-3.4 0-5.3-1.9-5.3-5.3V7.9H3.5z"/></svg>ALPHA</i><b class="num" id="h-bank">0</b></div>
    </div>
  </header>
  <main class="hbody">
    <section class="pane on" id="pane-players">
      <div class="show" id="h-car">
        <div class="glow"></div><div class="beam"></div><div class="floor"></div>
        <canvas id="h-turntable" aria-hidden="true"></canvas>
        <div class="pager">Select your runner<b id="h-who">1 / 3</b></div>
        <button class="arrow l" id="h-prev" type="button" aria-label="Previous">&#8249;</button>
        <button class="arrow r" id="h-next" type="button" aria-label="Next">&#8250;</button>
        <div class="dots" id="h-dots"></div>
      </div>
      <div class="hinfo" id="h-info"><div class="name d" id="h-name"></div><div class="title" id="h-title"></div><p class="story" id="h-story"></p></div>
      <div class="ward" id="h-ward" hidden><div class="outfits" id="h-outfits"></div><div class="swatches" id="h-swatches"></div></div>
      <div class="bw startw"><button class="abtn cy stripe" id="startb" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l14 9-14 9z"/></svg>Run</button></div>
      <div id="loadline">loading</div>
    </section>
    <section class="pane scroll" id="pane-missions"></section>
    <section class="pane scroll" id="pane-tasks"></section>
    <section class="pane scroll" id="pane-achievements"></section>
    <section class="pane scroll" id="pane-powerups"></section>
  </main>
  <nav class="tabs" id="h-tabs"></nav>
</div>

<!-- DEATH card -->
<div class="screen" id="dead">
  <div class="field"><i></i><i></i></div>
  <div class="pc card2 red"><div class="pe"><div class="pi">
    <h1 class="red" id="d-h1">CAUGHT</h1>
    <div class="tag" id="d-tag">the pack got you</div>
    <div class="stats">
      <div class="s"><b class="num" id="d-score">0</b>score</div>
      <div><b class="num" id="d-dist">0 m</b>distance</div>
      <div class="c"><b class="num" id="d-coins">0</b><i><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.5 4.5h17v3.4h-6.2v8.1c0 1.5.8 2.3 2.3 2.3h2.6v3.2h-3.4c-3.4 0-5.3-1.9-5.3-5.3V7.9H3.5z"/></svg>alpha</i></div>
      <div><b class="num" id="d-best">0</b>best</div>
    </div>
    <div id="d-newbest">new best</div>
    <div class="missions" id="d-missions"></div>
    <div class="btns two">
      <div class="bw"><button class="abtn cy" id="restartb" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.3 4H3l4-5 4 5H8.2A4.8 4.8 0 1 0 12 7.2z"/></svg>Run again</button></div>
      <div class="bw" style="--glow:transparent"><button class="abtn" id="d-home" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z"/></svg>Home</button></div>
    </div>
    <div id="loadline2"></div>
  </div></div></div>
</div>

<!-- PAUSE menu: RESUME (also Esc / tap outside), RESTART, SOUND, HOME -->
<div class="screen" id="paused">
  <div class="field"><i></i><i></i></div>
  <div class="pc card2 pmenu"><div class="pe"><div class="pi">
    <h1>PAUSED</h1>
    <div class="tag cy">Esc or tap outside to resume</div>
    <div class="stats" style="grid-template-columns:1fr 1fr">
      <div class="s"><b class="num" id="p-score">0</b>score</div>
      <div><b class="num" id="p-dist">0 m</b>distance</div>
    </div>
    <div class="btns">
      <div class="bw"><button class="abtn cy" id="resumeb" type="button"><span><svg viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none"><path d="M6 3l14 9-14 9z"/></svg>Resume</span><small>Esc</small></button></div>
      <div class="bw" style="--glow:transparent"><button class="abtn" id="p-restart" type="button"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5"/></svg>Restart</span><small>same seed</small></button></div>
      <div class="bw" style="--glow:transparent"><button class="abtn" id="soundb" type="button"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13"/></svg>Sound</span><small id="soundv">on</small></button></div>
      <div class="bw" style="--glow:transparent"><button class="abtn" id="p-home" type="button"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M6 10v10h4v-6h4v6h4V10"/></svg>Home</span><small>quit run</small></button></div>
    </div>
  </div></div></div>
</div>

<script type="module" src="./src/main.js?v=202609242348"></script>
</body>
</html>
